<main class="questionnaire-page">
  <section class="questionnaire-hero">
    <p class="eyebrow">Interactive Demo Builder</p>
    <h1>Choose what your sample website should show.</h1>
    <p>
      Answer a few quick questions and load a configurable demo based on the selected business needs.
    </p>
  </section>

  <div class="questionnaire-grid">
    <section class="questionnaire-card" aria-live="polite">
      <div id="question-progress"></div>
      <div id="question-host"></div>

      <div class="question-actions">
        <button id="back-question" type="button">Back</button>
        <button id="next-question" type="button">Next</button>
      </div>
    </section>

    <aside id="question-summary" class="question-summary"></aside>
  </div>
</main>

<link rel="stylesheet" href="examples/examples.css" />
<script type="module" src="examples/questionnaire.js"></script>
